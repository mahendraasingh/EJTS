<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Billboard - Live Display</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            user-select: none;
        }
        .billboard-kiosk {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .ad-media-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .ad-media-container img, .ad-media-container video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .kiosk-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 10, 10, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease;
        }
        .billboard-kiosk:hover .kiosk-nav-btn {
            opacity: 0.8;
        }
        .kiosk-nav-btn:hover {
            opacity: 1 !important;
            background: rgba(99, 102, 241, 0.8);
        }
        .kiosk-nav-left { left: 24px; }
        .kiosk-nav-right { right: 24px; }

        .kiosk-top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            opacity: 0.25;
            transition: opacity 0.3s;
        }
        .billboard-kiosk:hover .kiosk-top-actions {
            opacity: 1;
        }
        .kiosk-action-btn {
            background: rgba(10, 10, 10, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .kiosk-action-btn:hover {
            background: rgba(24, 24, 24, 0.95);
        }

        .kiosk-overlay {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }
        .live-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
        }
    </style>
</head>
<body>
    <div class="billboard-kiosk" id="billboardKiosk">
        <!-- Floating Navigation Controls -->
        <button class="kiosk-nav-btn kiosk-nav-left" onclick="prevAd()" title="Previous Campaign (Left Arrow)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="kiosk-nav-btn kiosk-nav-right" onclick="nextAd()" title="Next Campaign (Right Arrow / Space)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Top Right Control Buttons -->
        <div class="kiosk-top-actions">
            <button class="kiosk-action-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
                <i class="fa-solid fa-expand"></i> Fullscreen
            </button>
            <button class="kiosk-action-btn" onclick="window.close()" title="Exit Display">
                <i class="fa-solid fa-xmark"></i> Close
            </button>
        </div>

        <!-- Ad Media Container -->
        <div class="ad-media-container" id="adMediaContainer">
            <div class="default-billboard-screen" style="color: #64748b; text-align: center;">
                <i class="fa-solid fa-tower-broadcast" style="font-size: 54px; margin-bottom: 16px; color: #6366f1;"></i>
                <h2 style="color: #fff; margin-bottom: 8px;">Smart Billboard AI Display</h2>
                <p>Connecting to advertisement playlist engine...</p>
            </div>
        </div>

        <!-- Bottom Status Overlay -->
        <div class="kiosk-overlay" id="kioskOverlay">
            <span class="live-indicator"></span>
            <span id="currentAdTitle">Loading active playlist...</span>
            <span style="color: rgba(255, 255, 255, 0.2);">|</span>
            <span id="adDurationCountdown" style="color: #38bdf8; font-family: monospace; font-weight: 700;">--s</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/billboard.js') }}"></script>
</body>
</html>
