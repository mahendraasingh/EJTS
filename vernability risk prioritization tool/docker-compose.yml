version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vrpt-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=vrpt-prod-docker-secret-key-change-me
      - DATABASE_URL=postgresql://vrpt_user:vrpt_password@postgres:5432/vrpt_db
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vrpt-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: vrpt-postgres
    restart: always
    environment:
      - POSTGRES_USER=vrpt_user
      - POSTGRES_PASSWORD=vrpt_password
      - POSTGRES_DB=vrpt_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrpt_user -d vrpt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
